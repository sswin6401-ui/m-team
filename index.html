            const dbStatusEl = document.getElementById('db_status');
            rawDatabaseLines = [];
            
            // 유령 전각 공백 청소 및 개행 단위 쪼개기
            const cleanText = embedDatabase.replace(/ /g, '').replace(/\r\n/g, '\n');
            const lines = cleanText.split('\n');
            
            // 1. 조건을 기준으로 세로로 나열된 데이터를 그룹으로 묶습니다.
            let groupedData = {};
            let order = [];
            
            for(let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if(!line) continue;
                
                let parts = line.split(/\t+/).map(p => p.trim()).filter(Boolean);
                if (parts.length >= 2) {
                    let cond = parts[0];
                    let picks = parts[1];
                    
                    if(!groupedData[cond]) {
                        groupedData[cond] = [];
                        order.push(cond);
                    }
                    groupedData[cond].push(picks);
                }
            }
            
            const roleToIndex = { '탑': 0, '정글': 1, '미드': 2, '원딜': 3, '서폿': 4 };
            
            // 2. 그룹화된 데이터를 탑~서폿 14칸짜리 가로 배열로 완벽하게 재조립합니다.
            for(let i = 0; i < order.length; i++) {
                let cond = order[i];
                let picksList = groupedData[cond]; // 4줄 또는 5줄의 픽 데이터 묶음
                
                // 텍스트에서 포지션 이름(예: "정글")을 추출합니다.
                let roleMatch = cond.match(/\((.*?)\)/);
                let roleStr = roleMatch ? roleMatch[1] : '';
                let roleIndex = roleToIndex[roleStr] !== undefined ? roleToIndex[roleStr] : -1;
                
                // ✨ 핵심: '우리' 팀 조건은 자기 자신의 라인 추천이 빠져서 4줄밖에 없으므로, 해당 위치에 빈칸을 끼워 넣어 5줄로 줄을 맞춥니다.
                if (cond.startsWith('우리') && picksList.length === 4 && roleIndex !== -1) {
                    picksList.splice(roleIndex, 0, '');
                }
                
                let rowFormat = Array(14).fill('');
                
                // 이제 탑(0), 정글(1), 미드(2), 원딜(3), 서폿(4) 순서대로 제자리에 데이터를 꽂아줍니다!
                for(let r = 0; r < 5; r++) {
                    rowFormat[r * 3] = cond;
                    rowFormat[r * 3 + 1] = picksList[r] || '';
                }
                
                rawDatabaseLines.push(rowFormat);
            }
            
            console.log("로컬 DB 세팅 성공! 총 데이터수:", rawDatabaseLines.length);
            dbStatusEl.className = "text-xs font-black text-emerald-500 bg-emerald-500/10 px-3 py-0.5 rounded-full border border-emerald-500/20";
            dbStatusEl.innerHTML = "로컬 DB 로드 완료"; 
            calculate();
        }

        // ⭕ [수정 완료] 프로그램이 꺼져 있어도 조용히 수동 모드로 굴러가게 에러 완벽 차단
        function startLocalServerListener() {
            const statusEl = document.getElementById('sync_status');
            setInterval(() => {
                fetch('http://localhost:5882/get_lol_data')
                    .then(res => res.json())
                    .then(data => {
                        if (data.active) {
                            statusEl.className = "text-xs font-black text-emerald-500 bg-emerald-500/10 px-3 py-0.5 rounded-full border border-emerald-500/20 shadow-sm";
                            statusEl.innerHTML = "롤 연동 중";
                            
                            if (data.myPosition && roles.includes(data.myPosition)) {
                                const currentSelect = document.getElementById('my_position').value;
                                if (currentSelect !== data.myPosition) {
                                    document.getElementById('my_position').value = data.myPosition;
                                    changePosition();
                                }
                            }

                            const myPos = document.getElementById('my_position').value;
                            roles.forEach(r => {
                                if(r === myPos) return; 
                                if(data.our[r] !== undefined && document.getElementById('our_'+r)) { document.getElementById('our_'+r).value = data.our[r]; updateSlotIcon('our_'+r); }
                                if(data.enemy[r] !== undefined) { document.getElementById('enemy_'+r).value = data.enemy[r]; updateSlotIcon('enemy_'+r); }
                            });
                            calculate();
                        }
                    })
                    .catch(err => {
                        // 오버울프나 외부 툴 연동이 꺼져 있을 때 콘솔 에러 누출을 완전 틀어막는 보호 쉴드
                        statusEl.className = "text-[10px] font-black text-slate-400 bg-slate-500/10 px-2.5 py-0.5 rounded-full border border-slate-500/20";
                        statusEl.innerHTML = "클라이언트 미연결";
                    });
            }, 1000);
        }

        function getStandardName(inputVal) {
            let clean = inputVal.replace(/\s+/g, '').trim();
            if (clean === "문도박사") return "문도";
            if (clean === "유나라" || clean.toLowerCase() === "yunara") return "Yunara";
            if (clean === "규즈리얼" || clean === "규나" || clean.toLowerCase() === "gyuzreal") return "Ezreal";
            if (clean === "멜" || clean.toLowerCase() === "mel") return "Mel";
            if (clean === "자헨" || clean.toLowerCase() === "jahen") return "Jahen";
            if (clean === "크산테") return "크산테";
            if (clean === "누누와윌럼프" || clean === "누누와윌럼프") return "누누와 윌럼프";

            for (const [key, value] of Object.entries(championMap)) {
                if (key.replace(/\s+/g, '') === clean) {
                    for (const [realName, engName] of Object.entries(championMap)) {
                        if (engName === value && realName.length > 2 && !["자르반","신짜오","마스터이"].includes(realName)) return realName;
                    }
                    return key; 
                }
            }
            return inputVal;
        }

        function updateSlotIcon(id) {
            let rawVal = document.getElementById(id).value.trim();
            const imgEl = document.getElementById('img_' + id);
            const fallbackImg = "https://ddragon.leagueoflegends.com/cdn/14.22.1/img/profileicon/29.png";
            if (!rawVal) { imgEl.src = fallbackImg; return; }
            let stdName = getStandardName(rawVal);
            if (stdName === "Yunara") imgEl.src = YUNARA_ICON;
            else if (stdName === "Mel") imgEl.src = MEL_ICON;
            else if (stdName === "Jahen") imgEl.src = JAHEN_ICON;
            else if (championMap[stdName]) imgEl.src = `https://ddragon.leagueoflegends.com/cdn/14.22.1/img/champion/${championMap[stdName]}.png`;
            else imgEl.src = fallbackImg;
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('banpick_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        function changePosition() {
            const currentPos = document.getElementById('my_position').value;
            localStorage.setItem('banpick_position', currentPos);
            
            roles.forEach(role => {
                const wrapper = document.getElementById(`wrapper_our_${role}`);
                const badge = document.getElementById(`my_badge_${role}`);
                const label = document.getElementById(`label_our_${role}`);
                const img = document.getElementById(`img_our_${role}`);
                const input = document.getElementById(`our_${role}`);
                
                if (role === currentPos) {
                    wrapper.classList.remove('border-slate-300', 'dark:border-zinc-800', 'bg-slate-50', 'dark:bg-black/40', 'focus-within:border-blue-500', 'dark:focus-within:border-blue-500');
                    wrapper.classList.add('border-[#7c2ae8]', 'dark:border-[#a870ff]', 'bg-[#7c2ae8]/10', 'dark:bg-[#a870ff]/10', 'scale-[1.03]', 'shadow-[0_0_20px_rgba(124,42,232,0.2)]', 'z-10');
                    
                    badge.classList.remove('hidden');
                    label.classList.add('hidden'); 
                    
                    img.classList.remove('w-16', 'h-16', 'border-slate-300', 'dark:border-zinc-800', 'mb-2');
                    img.classList.add('w-20', 'h-20', 'border-[#7c2ae8]', 'dark:border-[#a870ff]', 'shadow-md', 'mb-3', 'mt-3');
                    
                    input.classList.add('text-[#7c2ae8]', 'dark:text-[#a870ff]', 'text-lg');
                } else {
                    wrapper.classList.add('border-slate-300', 'dark:border-zinc-800', 'bg-slate-50', 'dark:bg-black/40', 'focus-within:border-blue-500', 'dark:focus-within:border-blue-500');
                    wrapper.classList.remove('border-[#7c2ae8]', 'dark:border-[#a870ff]', 'bg-[#7c2ae8]/10', 'dark:bg-[#a870ff]/10', 'scale-[1.03]', 'shadow-[0_0_20px_rgba(124,42,232,0.2)]', 'z-10');
                    
                    badge.classList.add('hidden');
                    label.classList.remove('hidden');
                    
                    img.classList.add('w-16', 'h-16', 'border-slate-300', 'dark:border-zinc-800', 'mb-2');
                    img.classList.remove('w-20', 'h-20', 'border-[#7c2ae8]', 'dark:border-[#a870ff]', 'shadow-md', 'mb-3', 'mt-3');
                    
                    input.classList.remove('text-[#7c2ae8]', 'dark:text-[#a870ff]', 'text-lg');
                }
            });
            
            calculate();
        }

        function calculate() {
            const myPos = document.getElementById('my_position').value;
            let condIdx = 0; let pickIdx = 1;
            if (myPos.includes('정글')) { condIdx = 3; pickIdx = 4; }
            else if (myPos.includes('미드')) { condIdx = 6; pickIdx = 7; }
            else if (myPos.includes('원딜')) { condIdx = 9; pickIdx = 10; }
            else if (myPos.includes('서폿')) { condIdx = 12; pickIdx = 13; }
            
            const inputs = [];
            roles.forEach(role => {
                const ourInput = document.getElementById(`our_${role}`);
                const oVal = ourInput ? ourInput.value.trim() : '';
                const enemyEl = document.getElementById(`enemy_${role}`);
                const eVal = enemyEl ? enemyEl.value.trim() : '';
                
                if (oVal) inputs.push(`우리${getStandardName(oVal)}(${role})`);
                if (eVal) inputs.push(`적${getStandardName(eVal)}(${role})`);
            });
            const counts = {};
            rawDatabaseLines.forEach(row => {
                if (row.length <= condIdx) return;
                const sheetCondition = (row[condIdx] || '').replace(/\s+/g, '');
                if (!sheetCondition) return;
                inputs.forEach(val => {
                    const searchKey = val.replace(/\s+/g, '');
                    if (sheetCondition === searchKey) {
                        const rawPicks = row[pickIdx] || '';
                        const matches = rawPicks.split(',').map(v => v.trim()).filter(v => v);
                        matches.forEach((champ, index) => {
                            if (!counts[champ]) { counts[champ] = { score: 0, priority: 0 }; }
                            counts[champ].score += 1; counts[champ].priority += (100 - index);
                        });
                    }
                });
            });
            const sorted = Object.entries(counts).sort((a, b) => b[1].score !== a[1].score ? b[1].score - a[1].score : b[1].priority - a[1].priority);
            const resultDiv = document.getElementById('result');
            if (sorted.length === 0) {
                resultDiv.innerHTML = `<div class="text-slate-500 dark:text-zinc-600 font-bold text-center py-52 text-xs leading-relaxed italic">현재 매칭되는 데이터가 없습니다.<br>시트에서 [${myPos}] 열을 확인해 주세요.</div>`;
                return;
            }
            let html = '';
            sorted.forEach(([champ, data], index) => {
                const score = data.score; let isGlow = score >= 2;
                let cardClass = 'bg-slate-50 border-slate-200 dark:bg-zinc-950 dark:border-zinc-800 text-slate-900 dark:text-zinc-100';
                let badgeClass = 'bg-slate-300 text-slate-700 dark:bg-zinc-800 dark:text-zinc-400';
                if (isGlow) { cardClass = 'bg-amber-100 border-amber-300 dark:bg-amber-950/40 dark:border-amber-700/50 text-amber-900 dark:text-amber-400 font-extrabold'; badgeClass = 'bg-amber-500 text-white'; }
                
                let stdChampName = getStandardName(champ.trim());
                const fallbackImg = "https://ddragon.leagueoflegends.com/cdn/14.22.1/img/profileicon/29.png";
                const engName = championMap[stdChampName];
                
                let imgUrl = fallbackImg;
                if (stdChampName === "Yunara") imgUrl = YUNARA_ICON;
                else if (stdChampName === "Mel") imgUrl = MEL_ICON;
                else if (stdChampName === "Jahen") imgUrl = JAHEN_ICON;
                else if (engName) imgUrl = `https://ddragon.leagueoflegends.com/cdn/14.22.1/img/champion/${engName}.png`;
                
                html += `<div class="flex justify-between items-center border p-3 rounded-xl shadow-sm ${cardClass}"><div class="flex items-center gap-4"><span class="text-base font-black text-slate-400 dark:text-zinc-500 w-6 text-center">${index + 1}</span><img src="${imgUrl}" class="w-12 h-12 rounded-lg border border-slate-300 dark:text-zinc-700 object-cover shadow-inner"><span class="text-lg font-black tracking-wide">${champ}</span></div><span class="text-xs px-3 py-1.5 rounded-md font-mono font-black ${badgeClass}">${score}개 일치</span></div>`;
            });
            resultDiv.innerHTML = html;
        }

        function resetInputs() {
            roles.forEach(role => {
                const ourEl = document.getElementById(`our_${role}`); if (ourEl) { ourEl.value = ''; updateSlotIcon(`our_${role}`); }
                const enemyEl = document.getElementById(`enemy_${role}`); if (enemyEl) { enemyEl.value = ''; updateSlotIcon(`enemy_${role}`); }
            });
            calculate();
        }
    </script>
